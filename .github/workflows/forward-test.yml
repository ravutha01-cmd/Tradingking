# Forward test of the 5-a-day XAUUSD signals: every 15 minutes (GitHub often delays schedules), record new signals and
# results in data/forward/signals.json and commit them. The commit history is a
# timestamped record of each signal. Disable this workflow in the Actions tab to stop it.
name: Forward test (5-a-day signals)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record signals and commit
        # Retry against the latest branch head: other jobs (the monthly re-selection,
        # or a developer push) may have committed in the meantime.
        run: |
          git config user.name "forward-test-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            node scripts/forward/log.js
            if git diff --quiet -- data/forward js/forward-data.js; then echo "No changes."; exit 0; fi
            git add data/forward js/forward-data.js
            git commit -q -m "Forward test: $(node -e "const s=require('./data/forward/signals.json').summary;console.log(s.signals+' signals, '+s.closed+' closed, '+s.totalR+'R')")"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "Push rejected (branch moved); retrying ($attempt)…"
            sleep $((attempt * 10))
          done
          exit 1
